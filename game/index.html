<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight at the Leonida Museum</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 3 / 2; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Midnight at the Leonida Museum: sneak past the guards and cameras, steal the diamond, and slip out the exit"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
